services:
  - type: web
    name: tds-ga3-agents
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /tmp/ga3_tasks.sqlite3
      - key: GEMINI_API_KEY
        sync: false
